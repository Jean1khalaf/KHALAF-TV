name: Build and publish KHALAF TV Windows installer

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # This repository has no package-lock.json, so do not enable setup-node npm caching.
      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run desktop:build

      - name: Verify and rename installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist-desktop" -Filter "*.exe" -File |
            Where-Object { $_.Name -notlike "*-uninstaller.exe" } |
            Select-Object -First 1
          if (-not $installer) {
            Get-ChildItem -Path "dist-desktop" -Recurse | Select-Object FullName
            throw "No Windows setup EXE was created. Check electron-builder output above."
          }
          Copy-Item -LiteralPath $installer.FullName -Destination "KHALAF-TV-Setup.exe" -Force

      - name: Publish installer to a stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-installer
          name: KHALAF TV Windows Installer
          make_latest: true
          files: KHALAF-TV-Setup.exe
          fail_on_unmatched_files: true
